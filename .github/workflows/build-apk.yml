name: Build Butterleaf APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Butterleaf-v${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Butterleaf-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Publish a release you can download straight to your phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "Butterleaf v1.0.${{ github.run_number }}" \
            --notes "Install this APK on your Android phone. Every build is signed with the same key, so it installs over the previous version without losing your recipes." \
            || echo "Release step skipped (a release with this tag may already exist)."
